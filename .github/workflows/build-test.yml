name: Build and Test

on:
  push:
    branches: [main, master, "feature/*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 単一ジョブ。複数ブランチへの push を直列化して CI コストを抑える
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # WPF (UseWPF=true) のため Windows ランナー必須
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore PileDesign.sln

      - name: Build (Debug)
        run: dotnet build PileDesign.sln --no-restore --configuration Debug --nologo
        env:
          # 警告ベースライン: TreatWarningsAsErrors + 既存除外あり
          # CI でも同じ厳しさで build
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      # 通常テスト (遅いテストを除く)。ローカルと同じスクリプトを通し、実行件数の下限・意図しないスキップ・
      # 画面スレッドで拾われなかった例外 (dispatcher-exceptions.log) まで見る。
      # 以前は dotnet test を直接呼んでおり、件数が途中で減っても「成功」で通っていた
      - name: Test (excluding slow)
        run: |
          ./tools/run-tests.ps1 -NoBuild -Filter "TestCategory!=Slow" -EnforceMinimum
        shell: pwsh
        timeout-minutes: 25

      # 結果をアーティファクトとして残す (失敗時のデバッグ用)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestProject1/TestResults/*.trx
            TestProject1/TestResults/dispatcher-exceptions.log
          retention-days: 14

      # 収束リグレッションのスナップショット差分があった場合 (UPDATE_SNAPSHOTS なしで失敗)
      # も上記 test ステップで検出される。差分内容は trx に含まれる。

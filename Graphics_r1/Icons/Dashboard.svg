<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="100%" height="100%" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:1.5;">
    <g id="Dashboard">
        <rect x="0" y="0" width="128" height="128" style="fill:none;"/>
        <!-- 4 cards in 2x2 grid: alternating accent fill -->
        <rect x="14" y="14" width="46" height="46" rx="4" ry="4"
              style="fill:rgb(98,176,226);stroke:rgb(50,113,173);stroke-width:2.5;"/>
        <rect x="68" y="14" width="46" height="46" rx="4" ry="4"
              style="fill:white;stroke:rgb(50,113,173);stroke-width:2.5;"/>
        <rect x="14" y="68" width="46" height="46" rx="4" ry="4"
              style="fill:white;stroke:rgb(50,113,173);stroke-width:2.5;"/>
        <rect x="68" y="68" width="46" height="46" rx="4" ry="4"
              style="fill:rgb(98,176,226);stroke:rgb(50,113,173);stroke-width:2.5;"/>
        <!-- minimal "value" lines on white cards to suggest data -->
        <line x1="74" y1="28" x2="108" y2="28" style="stroke:rgb(50,113,173);stroke-width:2.5;stroke-linecap:round;"/>
        <line x1="74" y1="40" x2="100" y2="40" style="stroke:rgb(150,150,150);stroke-width:2;stroke-linecap:round;"/>
        <line x1="74" y1="50" x2="92" y2="50" style="stroke:rgb(150,150,150);stroke-width:2;stroke-linecap:round;"/>
        <line x1="20" y1="82" x2="54" y2="82" style="stroke:rgb(50,113,173);stroke-width:2.5;stroke-linecap:round;"/>
        <line x1="20" y1="94" x2="46" y2="94" style="stroke:rgb(150,150,150);stroke-width:2;stroke-linecap:round;"/>
        <line x1="20" y1="104" x2="38" y2="104" style="stroke:rgb(150,150,150);stroke-width:2;stroke-linecap:round;"/>
    </g>
</svg>
